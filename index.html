<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: sticky Kopf mit Fortschritt, Ansicht (Gerichte/Zutaten) und Saison-Filter; darunter Gruppen, je Gruppe nach Saison unterteilt */
:root{
  --bg:#f2f4ec; --surface:#fbfcf7; --fg:#1d2619; --muted:#5d6656; --line:#d8ddcc;
  --accent:#2c6a4a; --accent-ink:#ffffff;
  --sp:#2f8a3e; --sp-bg:#e0f0dc;
  --su:#9a6b00; --su-bg:#fbedc4;
  --fa:#b04f1c; --fa-bg:#f8e0d0;
  --wi:#2f69a8; --wi-bg:#dbe7f4;
  --yr:#5c6356; --yr-bg:#e6e8e0;
  --warn:#9b3b12;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a13; --surface:#1b2219; --fg:#e7ecdf; --muted:#9aa492; --line:#2f382b;
  --accent:#6fc196; --accent-ink:#0f1a12;
  --sp:#7fd08a; --sp-bg:#1f3a22; --su:#f0c552; --su-bg:#3a3014; --fa:#f29a68; --fa-bg:#3d2417;
  --wi:#8bb8ec; --wi-bg:#1b2b40; --yr:#b4baab; --yr-bg:#2a3027; --warn:#f2a47a; --ava-l:78%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a13; --surface:#1b2219; --fg:#e7ecdf; --muted:#9aa492; --line:#2f382b;
  --accent:#6fc196; --accent-ink:#0f1a12;
  --sp:#7fd08a; --sp-bg:#1f3a22; --su:#f0c552; --su-bg:#3a3014; --fa:#f29a68; --fa-bg:#3d2417;
  --wi:#8bb8ec; --wi-bg:#1b2b40; --yr:#b4baab; --yr-bg:#2a3027; --warn:#f2a47a; --ava-l:78%; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body)}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
a{color:inherit}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:14px 12px}
.titlerow{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
h1{font:800 clamp(22px,4.5vw,30px)/1.1 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.count{font:500 14px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.stats{display:flex;flex-wrap:wrap;gap:4px 18px}
.stats b{color:var(--fg)}
.bar{height:8px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.switches{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}
.modes{display:inline-flex;gap:4px;background:var(--line);padding:3px;border-radius:10px}
.mode{font:800 15px var(--f-display);background:transparent;color:var(--muted);border:0;padding:6px 14px;border-radius:8px;cursor:pointer}
.mode[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tabs{display:inline-flex;border:1.5px solid var(--fg);border-radius:8px;overflow:hidden}
.tab{font:700 14px var(--f-body);background:var(--surface);color:var(--fg);border:0;padding:6px 16px;cursor:pointer}
.tab+.tab{border-left:1.5px solid var(--fg)}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.chip{font:700 13px var(--f-body);border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:5px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.sp[aria-pressed="true"]{background:var(--sp);border-color:var(--sp);color:var(--surface)}
.chip.su[aria-pressed="true"]{background:var(--su);border-color:var(--su);color:var(--surface)}
.chip.fa[aria-pressed="true"]{background:var(--fa);border-color:var(--fa);color:var(--surface)}
.chip.wi[aria-pressed="true"]{background:var(--wi);border-color:var(--wi);color:var(--surface)}
.chip.yr[aria-pressed="true"]{background:var(--yr);border-color:var(--yr);color:var(--surface)}
.chip:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-left:auto;cursor:pointer}
.toggle input{width:16px;height:16px;accent-color:var(--accent)}

.intro{color:var(--muted);font-size:14px;max-width:65ch;margin:18px 0 0}

section.group{margin-top:28px}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:2px solid var(--fg);padding-bottom:4px}
.ghead h2{font:800 20px/1.2 var(--f-display);margin:0}
.ghead .count{font-size:13px}
.bucket{font:700 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px;display:flex;align-items:center;gap:8px}
.bucket::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c,var(--yr));flex:none}
ul.items{list-style:none;margin:0;padding:0}
li.item{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
li.item:last-child{border-bottom:0}
li.item input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
li.item input:disabled{cursor:default}
.main{min-width:0}
.name{font-weight:700}
.name a{text-decoration:none;border-bottom:1px dotted var(--muted)}
.name a:hover{border-bottom-style:solid}
.note{font-size:13px;color:var(--muted);margin-top:1px}
.note b{color:var(--warn);font-weight:700}
.qty{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.qty small{display:block;font-size:11px;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pill{font:700 11px/1 var(--f-body);padding:4px 7px;border-radius:4px;color:var(--c);background:var(--cb)}
.pill.have{text-decoration:line-through;opacity:.6}
.sp{--c:var(--sp);--cb:var(--sp-bg)} .su{--c:var(--su);--cb:var(--su-bg)}
.fa{--c:var(--fa);--cb:var(--fa-bg)} .wi{--c:var(--wi);--cb:var(--wi-bg)} .yr{--c:var(--yr);--cb:var(--yr-bg)}
.ready{font:700 10px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);display:block}
li.item.done .name,li.item.done .note,li.item.done .pills{opacity:.5}
li.item.done .name{text-decoration:line-through}
.empty{color:var(--muted);font-size:14px;padding:10px 0}

footer{margin-top:36px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}
.sync::before{content:"● ";color:var(--muted)}
.sync.ok::before{color:var(--accent)}
.sync.bad{color:var(--warn);font-weight:700}
.sync.bad::before{color:var(--warn)}
.reset{font:700 13px var(--f-body);background:none;border:1.5px solid var(--line);color:var(--fg);border-radius:6px;padding:5px 10px;cursor:pointer}
.reset.arm{border-color:var(--warn);color:var(--warn)}
/* Dorfbewohner: Hover zeigt Karte rechts unter der Zeile (nur Maus, breite Fenster), Klick klappt sie in der Zeile auf */
.npc .tabs,.npc .chip,.npc .stats>span:last-child{display:none}
.npc .toggle{margin-left:0}
li.npc{position:relative;cursor:pointer;align-items:center;grid-template-columns:auto auto 1fr auto}
li.npc input{margin:0}
li.item.done .ava{opacity:.5}
.ava{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 15px var(--f-display);background:hsl(var(--h) 45% 50% / .2);color:hsl(var(--h) 50% var(--ava-l,32%))}
.more{font:700 13px var(--f-mono);background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer}
li.npc.open .more{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.gift{display:none;grid-column:1/-1;cursor:auto;padding:4px 0 6px}
li.npc.open .gift{display:block}
.gift h3{font:800 13px var(--f-display);letter-spacing:.06em;text-transform:uppercase;margin:10px 0 6px}
.gift h3:first-child{margin-top:4px}
.gchips{display:flex;flex-wrap:wrap;gap:5px}
.gchip{display:inline-flex;align-items:center;gap:5px;font:700 13px/1.2 var(--f-body);padding:4px 8px 4px 5px;border-radius:6px;color:var(--c);background:var(--cb)}
.gchip a{text-decoration:none}
.gchip a:hover{text-decoration:underline}
.gchip .ico{font-size:17px;line-height:1}
.gchip.nn{color:var(--fg);background:var(--surface);border:1px solid var(--line)}
.gchips.small .gchip{font-size:12px;padding:2px 7px 2px 4px}
.gchips.small .ico{font-size:14px}
.intro details{margin-top:8px}
.intro summary{cursor:pointer;font-weight:700;color:var(--fg)}
.intro details p{margin:6px 0 0}
.uni{font-size:13px;color:var(--muted);margin-top:6px}
.warnline{color:var(--warn);font-weight:700}
@media (hover:hover) and (pointer:fine) and (min-width:700px){
  li.npc:not(.open):hover .gift{display:block;position:absolute;left:38%;right:0;top:calc(100% - 6px);z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px 12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
  li.npc:hover{background:var(--surface)}
  /* Platz unter der Liste, damit die Karte der letzten Zeilen die Seite nicht verlängert (sonst springt die Scrollleiste) */
  .npc main{padding-bottom:320px}
}
@media (max-width:520px){.toggle{margin-left:0}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div class="wrap">

  </header>

  <div class="intro" id="intro"></div>

  <main id="list"></main>

  <footer>
    <span class="sync" id="sync">In diesem Browser gespeichert</span>

  </footer>
</div>

// ---------- gemeinsame Logik für Kochen und Craften ----------
const SEASON={Sp:"Frühling",Su:"Sommer",Fa:"Herbst",Wi:"Winter"};
const CLS={Sp:"sp",Su:"su",Fa:"fa",Wi:"wi"};
const ORDER=["Sp","Su","Fa","Wi"];

function makeMode(cfg){
  const ING={};
  for(const g of cfg.groups) for(const [id,name,s,note] of g.items) ING[id]={id,name,s,note};
  const REC=cfg.recipes.map(([cat,id,name,list])=>({cat,id,name,ings:list.split(" ").map(t=>{const [k,n]=t.split("*");return [k,+(n||1)]})}));
  const RECBY=Object.fromEntries(REC.map(r=>[r.id,r]));
  const Y=cfg.yields;
  const INTER=Object.keys(Y);
  function seasonsOf(id){
    const it=ING[id];
    if(it.s==="-"){const set=new Set();for(const [k] of RECBY[id].ings) seasonsOf(k).forEach(x=>set.add(x));return ORDER.filter(x=>set.has(x))}
    return it.s==="all"?[]:it.s.split(" ");
  }
  for(const id in ING) ING[id].seasons=seasonsOf(id);
  for(const r of REC){const set=new Set();for(const [k] of r.ings) ING[k].seasons.forEach(x=>set.add(x));r.seasons=ORDER.filter(x=>set.has(x))}
  // Bedarf: jedes offene Rezept braucht seine Zutaten. Zwischenprodukte werden so oft hergestellt,
  // wie offene Rezepte sie brauchen (geteilt durch den Ertrag), mindestens einmal, solange ihr eigenes Rezept offen ist.
  function computeNeed(done){
    const use={};
    const add=(k,n)=>use[k]=(use[k]||0)+n;
    for(const r of REC){ if(done[r.id]||Y[r.id]) continue; for(const [k,n] of r.ings) add(k,n); }
    for(const i of INTER){
      const units=use[i]||0;
      const runs=Math.max(Math.ceil(units/Y[i]), done[i]?0:1);
      use[i]=units>0?units:(runs?Y[i]:0);
      for(const [k,n] of RECBY[i].ings) add(k,n*runs);
    }
    return use;
  }
  const BASE=computeNeed({});
  const usedBy=(id,done)=>REC.filter(r=>!done[r.id]&&r.ings.some(([k])=>k===id)).map(r=>r.name);
  return {...cfg,ING,REC,RECBY,computeNeed,BASE,usedBy};
}

const LS={cook:["gourmet-chef-checked-v1","gourmet-chef-cooked-v1"],craft:["craft-master-checked-v1","craft-master-crafted-v1"]};
const S={cook:{checked:{},done:{}},craft:{checked:{},done:{}},npc:{checked:{},done:{}}};
const LS_NPC="dorf-done-v1";
let mode="cook", view="rec", filter="alle", hideDone=false;
let docRef=null, dirty=false, writing=false, timer=null;

function bucketOf(seasons){
  if(!seasons.length) return 5;
  if(seasons.length===1) return ORDER.indexOf(seasons[0]);
  return 4+ORDER.indexOf(seasons[0])/10;
}
function bucketLabel(b,rec){
  if(b===5) return ["Ganzjährig","yr"];
  if(b>=4) return [rec?"Zutaten aus mehreren Jahreszeiten, früh einlagern":"Mehrere Jahreszeiten","yr"];
  return [SEASON[ORDER[b]],CLS[ORDER[b]]];
}
function seasonMatch(seasons){
  if(filter==="alle") return true;
  if(filter==="all") return !seasons.length;
  return seasons.includes(filter);
}
function wiki(name){return "https://stardewvalleywiki.com/"+encodeURIComponent(name.replace(/ /g,"_"))}
function pillsFor(seasons){
  return (seasons.length?seasons.map(k=>`<span class="pill ${CLS[k]}">${SEASON[k]}</span>`):[`<span class="pill yr">Ganzjährig</span>`]).join("");
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function linkName(name,nolink){return nolink?esc(name):`<a href="${wiki(name)}" target="_blank" rel="noopener">${esc(name)}</a>`}

function render(){
  document.body.classList.toggle("npc",mode==="npc");
  document.querySelectorAll(".mode").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.mode===mode)));
  if(mode==="npc") return renderNpc();
  const M=MODES[mode], st=S[mode];
  const need=M.computeNeed(st.done);
  const nDone=M.REC.filter(r=>st.done[r.id]).length;
  const open=Object.keys(M.ING).filter(id=>(need[id]||0)>0&&!st.checked[id]).length;
  document.getElementById("recStat").textContent=M.recLabel;
  document.getElementById("doneCount").textContent=`${nDone} / ${M.REC.length}`;
  document.getElementById("openStat").textContent=M.openWord;
  document.getElementById("openCount").textContent=open;
  document.getElementById("bar").style.width=(nDone/M.REC.length*100)+"%";
  document.getElementById("tab-rec").textContent=M.recLabel;
  document.getElementById("tab-ing").textContent=M.ingLabel;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.view===view)));
  document.getElementById("intro").textContent=view==="rec"?M.introRec:M.introIng;
  const root=document.getElementById("list");
  root.textContent="";
  if(view==="rec") renderRecipes(root,M,st); else renderIngredients(root,M,st,need);
}

function renderGroup(root,title,rows,doneCount,totalCount,rec){
  const sec=document.createElement("section"); sec.className="group";
  sec.innerHTML=`<div class="ghead"><h2></h2><span class="count">${doneCount} / ${totalCount}</span></div>`;
  sec.querySelector("h2").textContent=title;
  if(!rows.length){const p=document.createElement("p");p.className="empty";p.textContent="Nichts in dieser Auswahl.";sec.append(p);root.append(sec);return}
  let last=null, ul=null;
  for(const row of rows){
    const [label,cls]=bucketLabel(row.b,rec);
    if(label!==last){
      const h=document.createElement("div"); h.className="bucket "+cls; h.textContent=label;
      ul=document.createElement("ul"); ul.className="items"; sec.append(h,ul); last=label;
    }
    ul.append(row.li);
  }
  root.append(sec);
}

function renderRecipes(root,M,st){
  const cats=[...new Set(M.REC.map(r=>r.cat))];
  for(const cat of cats){
    const recs=M.REC.map((r,i)=>({r,i,b:bucketOf(r.seasons)})).filter(x=>x.r.cat===cat).sort((a,b)=>a.b-b.b||a.i-b.i);
    const out=[];
    for(const {r,b} of recs){
      const done=!!st.done[r.id];
      if(hideDone&&done) continue;
      if(!seasonMatch(r.seasons)) continue;
      const allHave=r.ings.every(([k])=>st.checked[k]);
      const chips=r.ings.map(([k,n])=>{
        const it=M.ING[k], cls=it.seasons.length===1?CLS[it.seasons[0]]:"yr";
        return `<span class="pill ${cls}${st.checked[k]?" have":""}">${esc(it.name)}${n>1?" ×"+n:""}</span>`;
      }).join("");
      const li=document.createElement("li");
      li.className="item"+(done?" done":"");
      li.innerHTML=`<input type="checkbox" id="${mode}-r-${r.id}" ${done?"checked":""} aria-label="${esc(r.name)} ${M.doneWord}">
        <div class="main"><div class="name">${linkName(r.name)}</div><div class="pills">${chips}</div></div>
        <div class="qty">${!done&&allHave?'<span class="ready">Alles da</span>':""}</div>`;
      li.querySelector("input").addEventListener("change",e=>{ if(e.target.checked) st.done[r.id]=true; else delete st.done[r.id]; save(); });
      out.push({b,li});
    }
    renderGroup(root,cat,out,recs.filter(x=>st.done[x.r.id]).length,recs.length,true);
  }
}

function renderIngredients(root,M,st,need){
  for(const g of M.groups){
    const items=g.items.map((it,i)=>({id:it[0],i,b:bucketOf(M.ING[it[0]].seasons)})).sort((a,b)=>a.b-b.b||a.i-b.i);
    let doneCount=0; const out=[];
    for(const {id,b} of items){
      const it=M.ING[id], n=need[id]||0, base=M.BASE[id]||0;
      const done=n===0||!!st.checked[id];
      if(done) doneCount++;
      if(hideDone&&done) continue;
      if(!seasonMatch(it.seasons)) continue;
      const users=M.usedBy(id,st.done);
      const forTxt=n===0?"Nicht mehr nötig":(users.length>4?`Für ${users.length} Rezepte`:`Für ${users.join(", ")}`);
      const li=document.createElement("li");
      li.className="item"+(done?" done":"");
      li.innerHTML=`<input type="checkbox" id="${mode}-i-${id}" ${st.checked[id]?"checked":""} ${n===0?"disabled":""} aria-label="${esc(it.name)} habe ich">
        <div class="main"><div class="name">${linkName(it.name,id==="anyfish"||id==="wildseedsany")}</div>
        <div class="note">${it.note}</div><div class="note">${esc(forTxt)}</div><div class="pills">${pillsFor(it.seasons)}</div></div>
        <div class="qty">×${n}${n!==base?`<small>von ${base}</small>`:""}</div>`;
      li.querySelector("input").addEventListener("change",e=>{ if(e.target.checked) st.checked[id]=true; else delete st.checked[id]; save(); });
      out.push({b,li});
    }
    renderGroup(root,g.name,out,doneCount,g.items.length,false);
  }
}

const SEASON_OF={};
for(const m of Object.values(MODES)) for(const it of Object.values(m.ING)) if(!(it.name in SEASON_OF)) SEASON_OF[it.name]=it.seasons;
const openNpc=new Set();
function hue(n){let h=0;for(const c of n) h=(h*31+c.charCodeAt(0))%360;return h}
function giftChip(name){
  const s=SEASON_OF[name], cls=!s?"nn":s.length===1?CLS[s[0]]:"yr";
  const tip=s?(s.length?s.map(k=>SEASON[k]).join(", "):"Ganzjährig"):"";
  const cat=/^(Alle|Strand|Gekocht)/.test(name);
  return `<span class="gchip ${cls}"${tip?` title="${tip}"`:""}><span class="ico" aria-hidden="true">${iconOf(name)}</span>${cat?esc(name):linkName(name)}</span>`;
}
function renderNpc(){
  const total=NPC_GROUPS.reduce((a,g)=>a+g.people.length,0), D=S.npc.done;
  const nDone=Object.keys(D).length;
  document.getElementById("recStat").textContent="Dorfbewohner";
  document.getElementById("doneCount").textContent=`${nDone} / ${total}`;
  document.getElementById("bar").style.width=(nDone/total*100)+"%";
  document.getElementById("intro").innerHTML=`Fahr mit der Maus über einen Namen oder tipp ihn an. Farbige Gaben haben eine Jahreszeit (aus den Koch- und Craftlisten), grau umrandete sind dort nicht erfasst.<details><summary>Was zählt als universell?</summary><p><b>Universelle Lieblinge:</b> ${UNI_LOVES.join(", ")}.</p><p><b>Universelle Vorlieben:</b> ${UNI_LIKES}.</p></details>`;
  const root=document.getElementById("list"); root.textContent="";
  for(const g of NPC_GROUPS){
    const sec=document.createElement("section"); sec.className="group";
    sec.innerHTML=`<div class="ghead"><h2>${g.name}</h2><span class="count">${g.people.filter(p=>D[p[0]]).length} / ${g.people.length}</span></div>`;
    const ul=document.createElement("ul"); ul.className="items";
    for(const [name,loves,likes,ex] of g.people){
      const L=loves.split("|"), K=likes.split("|"), hate=UNI_LOVE_EXCEPT[name];
      const uni=UNI_LOVES.filter(x=>x!==hate&&!L.includes(x));
      const open=openNpc.has(name), done=!!D[name];
      if(hideDone&&done) continue;
      const li=document.createElement("li"); li.className="item npc"+(open?" open":"")+(done?" done":"");
      li.innerHTML=`<input type="checkbox" id="npc-${name}" ${done?"checked":""} aria-label="${name} erledigt">
        <span class="ava" style="--h:${hue(name)}" aria-hidden="true">${name[0]}</span>
        <div class="main"><div class="name">${linkName(name)}</div><div class="note">Liebt ${esc(L.slice(0,3).join(", "))}${L.length>3?` und ${L.length-3} weitere`:""}</div></div>
        <button class="more" type="button" aria-expanded="${open}" aria-label="Geschenke für ${name}">♥ ${L.length}</button>
        <div class="gift">
          <h3>Liebt</h3><div class="gchips">${L.map(giftChip).join("")}</div>
          <div class="uni">Dazu universell geliebt:</div><div class="gchips small">${uni.map(giftChip).join("")}</div>
          ${hate?`<div class="uni warnline">Achtung: ${name} hasst ${hate}.</div>`:""}
          <h3>Mag</h3><div class="gchips">${K.map(giftChip).join("")}</div>
          <div class="uni">Dazu alle universellen Vorlieben${ex?`, außer: ${esc(ex)}`:""}.</div>
        </div>`;
      li.querySelector("input").addEventListener("change",e=>{ if(e.target.checked) D[name]=true; else delete D[name]; save(); });
      li.addEventListener("click",e=>{
        if(e.target.closest("a,input")) return;
        if(openNpc.has(name)) openNpc.delete(name); else openNpc.add(name);
        li.classList.toggle("open"); li.querySelector(".more").setAttribute("aria-expanded",String(openNpc.has(name)));
      });
      ul.append(li);
    }
    if(!ul.children.length){const p=document.createElement("p");p.className="empty";p.textContent="Alle erledigt.";sec.append(p)}
    sec.append(ul); root.append(sec);
  }
}

const LOCAL_OK=(()=>{try{localStorage.setItem("__t","1");const ok=localStorage.getItem("__t")==="1";localStorage.removeItem("__t");return ok}catch(e){return false}})();
function saveLocal(){try{for(const m in LS){localStorage.setItem(LS[m][0],JSON.stringify(S[m].checked));localStorage.setItem(LS[m][1],JSON.stringify(S[m].done))}localStorage.setItem(LS_NPC,JSON.stringify(S.npc.done))}catch(e){}}
function loadDoc(v){
  S.cook.checked={...(v.checked||{})}; S.cook.done={...(v.cooked||{})};
  S.craft.checked={...(v.craftChecked||{})}; S.craft.done={...(v.crafted||{})};
  S.npc.done={...(v.npcDone||{})};
}
function hasAny(){return ["cook","craft","npc"].some(m=>Object.keys(S[m].checked).length||Object.keys(S[m].done).length)}
function save(){
  saveLocal(); render();
  if(docRef){dirty=true;clearTimeout(timer);timer=setTimeout(flush,700)}
}
async function flush(){
  if(!docRef||writing||!dirty) return;
  writing=true; dirty=false;
  try{ await docRef.set({checked:{...S.cook.checked},cooked:{...S.cook.done},craftChecked:{...S.craft.checked},crafted:{...S.craft.done},npcDone:{...S.npc.done},updated:Date.now()}); setSync(true); }
  catch(e){
    // Wer die Seite nur ansehen darf (z. B. per Link geteilt), kann nicht ins Konto schreiben: dann bleibt alles im Browser
    if(e&&e.code==="invalid_argument"){ docRef=null; setSync(false); }
    else setSync(false,"Speichern im Konto fehlgeschlagen, in diesem Browser gesichert");
  }
  writing=false;
  if(dirty) flush();
}
function setSync(ok,text){
  const el=document.getElementById("sync");
  el.className="sync"+(ok?" ok":LOCAL_OK?"":" bad");
  el.textContent=text||(ok?"In deinem Konto gespeichert":LOCAL_OK?"In diesem Browser gespeichert":"Achtung: Dieser Browser speichert hier nicht, Häkchen gehen beim Schließen verloren");
  el.title=ok?"Gilt auf jedem Gerät, auf dem du angemeldet bist":"Bleibt erhalten, solange du denselben Browser nutzt und die Browserdaten nicht löschst (nicht im privaten Fenster, nicht im WhatsApp- oder Instagram-Browser)";
}

function remember(){try{localStorage.setItem("gourmet-ui",JSON.stringify({mode,view}))}catch(e){}}

// ---------- Bedienung ----------
document.querySelectorAll(".mode").forEach(t=>t.addEventListener("click",()=>{mode=t.dataset.mode;remember();render()}));
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{view=t.dataset.view;remember();render()}));
document.querySelectorAll(".chip").forEach(btn=>btn.addEventListener("click",()=>{
  filter=btn.dataset.f;
  document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",String(b===btn)));
  render();
}));
document.getElementById("hideDone").addEventListener("change",e=>{hideDone=e.target.checked;render()});
const resetBtn=document.getElementById("reset");
let armed=null;
const MODE_NAME={cook:"Kochen",craft:"Craften",npc:"Dorfbewohner"};
function resetLabel(){resetBtn.textContent=`${MODE_NAME[mode]} zurücksetzen`}
resetBtn.addEventListener("click",()=>{
  if(!armed){
    resetBtn.classList.add("arm"); resetBtn.textContent=`Wirklich alle Häkchen bei ${MODE_NAME[mode]} löschen?`;
    armed=setTimeout(()=>{armed=null;resetBtn.classList.remove("arm");resetLabel()},4000);
    return;
  }
  clearTimeout(armed); armed=null; resetBtn.classList.remove("arm");
  S[mode]={checked:{},done:{}}; save(); resetLabel();
});
const _render=render; render=function(){_render(); if(!armed) resetLabel();};

for(const m in LS){
  try{S[m].checked=JSON.parse(localStorage.getItem(LS[m][0])||"{}")||{}}catch(e){}
  try{S[m].done=JSON.parse(localStorage.getItem(LS[m][1])||"{}")||{}}catch(e){}
}
try{const u=JSON.parse(localStorage.getItem("gourmet-ui")||"{}");if(u.mode in MODES||u.mode==="npc")mode=u.mode;if(u.view==="rec"||u.view==="ing")view=u.view}catch(e){}
try{S.npc.done=JSON.parse(localStorage.getItem(LS_NPC)||"{}")||{}}catch(e){}
if(location.hash==="#craften")mode="craft"; else if(location.hash==="#kochen")mode="cook"; else if(location.hash==="#dorf")mode="npc";
if(location.hash) remember();
setSync(false);
render();

(async()=>{
  if(!window.claude||!window.claude.use) return;
  const [d,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(!d||!user) return;
  const uid=await user.id();
  if(!uid) return;
  docRef=d.doc("data/users/"+uid+"/gourmet");
  let first=true;
  docRef.onSnapshot(snap=>{
    if(first){
      first=false;
      if(snap.exists){ loadDoc(snap.data()); setSync(true); }
      else if(hasAny()){ dirty=true; flush(); }
      saveLocal(); render(); return;
    }
    if(snap.metadata.hasPendingWrites||dirty||writing) return;
    if(snap.exists){ loadDoc(snap.data()); saveLocal(); render(); }
  },()=>setSync(false));
})();

</script>
